{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CampusReserve university resource booking system">
    <title>{% block title %}CampusReserve{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="{% url 'core:home' %}">CampusReserve</a>
        <div class="nav-links">
          {% if user.is_authenticated %}
            <a href="{% url 'resources:room-list' %}">Rooms</a>
            <a href="{% url 'resources:equipment-list' %}">Equipment</a>
          {% endif %}
        </div>
        <div class="account-nav">
          {% if user.is_authenticated %}
            <span class="account-name">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="nav-button" type="submit">Log out</button>
            </form>
          {% else %}
            <a class="nav-button" href="{% url 'login' %}">Log in</a>
          {% endif %}
        </div>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
