{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CampusReserve university resource booking system">
    <title>{% block title %}CampusReserve{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="{% url 'core:home' %}">CampusReserve</a>
        <div class="nav-links">
          <a href="{% url 'resources:room-list' %}">Rooms</a>
          <a href="{% url 'resources:equipment-list' %}">Equipment</a>
        </div>
        <span class="stage-label">Part 3 · Catalogues</span>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
