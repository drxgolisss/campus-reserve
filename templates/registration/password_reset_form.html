{% extends "base.html" %}

{% block title %}Reset password · CampusReserve{% endblock %}

{% block content %}
  <section class="page-shell auth-shell">
    <div class="auth-card">
      <p class="eyebrow">Account recovery</p>
      <h1>Reset password</h1>
      <p class="auth-intro">Enter the email address connected to your account.</p>

      <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-field">
          <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
          {{ form.email }}
          {{ form.email.errors }}
        </div>
        <button class="button" type="submit">Send reset link</button>
      </form>

      <p class="auth-footer"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
  </section>
{% endblock %}
